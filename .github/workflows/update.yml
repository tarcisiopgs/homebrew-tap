name: Update formula

# Follows the releases of the projects in this tap: when a new one has its
# binaries, the formula is rewritten, installed, tested and committed. It
# runs on this repository's own token, so no secret is stored anywhere.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Update, install, test and commit each formula
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          for name in devsweep otto; do
            bash scripts/update.sh "$name"
            if [ -z "$(git status --porcelain "Formula/$name.rb")" ]; then
              echo "$name: nothing new"
              continue
            fi
            # Homebrew only installs from a tap: this checkout becomes one.
            taps="$(brew --repository)/Library/Taps/tarcisiopgs"
            if [ ! -e "$taps/homebrew-tap" ]; then
              mkdir -p "$taps"
              ln -s "$PWD" "$taps/homebrew-tap"
            fi
            brew install "tarcisiopgs/tap/$name"
            brew test "tarcisiopgs/tap/$name"
            version=$("$name" --version | cut -d ' ' -f 2)
            git add "Formula/$name.rb"
            git commit -m "$name $version"
          done
          git push
