name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install and test every formula
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          # Homebrew only installs from a tap: this checkout becomes one.
          taps="$(brew --repository)/Library/Taps/tarcisiopgs"
          mkdir -p "$taps"
          ln -s "$PWD" "$taps/homebrew-tap"
          for name in devsweep otto; do
            brew install "tarcisiopgs/tap/$name"
            brew test "tarcisiopgs/tap/$name"
            "$name" --version
          done
